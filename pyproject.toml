[project]
name = "mini-claude-code"
version = "0.1.0"
description = "A local coding agent: Ollama inference, Postgres memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "pathspec>=1.1.1",
    "prompt-toolkit>=3.0.53",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.scripts]
mcc = "mcc.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
